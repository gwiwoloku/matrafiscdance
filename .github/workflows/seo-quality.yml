name: SEO quality checks

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "sitemap.xml"
      - "robots.txt"
      - "_redirects"
      - ".htaccess"
      - "scripts/seo_audit.py"
      - ".github/workflows/seo-quality.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/seo_audit.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SEO and internal-link audit
        run: python scripts/seo_audit.py
      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check enhancements.js
          node --check locale.js
          node --check privacy.js
          node --check site-common.js
